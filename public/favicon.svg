<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- a still of the liquid-metal Rubik's cube: three faces, nine rounded plates each, the mint chrome pooling light on
       the top, dark teal down the sides, a couple of the shader's ringed blobs -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefbf7"/>
      <stop offset="0.55" stop-color="#b9efe0"/>
      <stop offset="1" stop-color="#5fc1aa"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6bf"/>
      <stop offset="0.5" stop-color="#2f8f7c"/>
      <stop offset="1" stop-color="#123f39"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a6d62"/>
      <stop offset="0.6" stop-color="#123c37"/>
      <stop offset="1" stop-color="#071f1c"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#062b2a"/>
      <stop offset="0.62" stop-color="#0a3c3a"/>
      <stop offset="0.72" stop-color="#1c5fd6"/>
      <stop offset="0.8" stop-color="#7ee0ff"/>
      <stop offset="0.88" stop-color="#f2e24a"/>
      <stop offset="1" stop-color="#f2e24a" stop-opacity="0"/>
    </radialGradient>
    <!-- one face: nine plates in a 30 × 30 square, gaps of 1.6, corners rounded -->
    <g id="plates">
      <rect x="0.8" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="0.8" width="8.8" height="8.8" rx="1.6"/>
      <rect x="0.8" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="10.6" width="8.8" height="8.8" rx="1.6"/>
      <rect x="0.8" y="20.4" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="20.4" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="20.4" width="8.8" height="8.8" rx="1.6"/>
    </g>
    <!-- a clip may not reference a group, so the plates again -->
    <clipPath id="clipTop"><rect x="0.8" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="0.8" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="0.8" y="20.4" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="20.4" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="20.4" width="8.8" height="8.8" rx="1.6"/></clipPath>
    <clipPath id="clipRight"><rect x="0.8" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="0.8" width="8.8" height="8.8" rx="1.6"/><rect x="0.8" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="10.6" width="8.8" height="8.8" rx="1.6"/><rect x="0.8" y="20.4" width="8.8" height="8.8" rx="1.6"/><rect x="10.6" y="20.4" width="8.8" height="8.8" rx="1.6"/><rect x="20.4" y="20.4" width="8.8" height="8.8" rx="1.6"/></clipPath>
  </defs>
  <g transform="translate(32 32) scale(0.92) translate(-32 -38)">
  <!-- the body behind the gaps: the site's near-black ground -->
  <g transform="translate(32 8)">
    <path d="M0 0 L26 15 L0 30 L-26 15 Z" fill="#07120f"/>
    <path d="M-26 15 L0 30 L0 60 L-26 45 Z" fill="#07120f"/>
    <path d="M26 15 L0 30 L0 60 L26 45 Z" fill="#07120f"/>
  </g>
  <!-- top face -->
  <g transform="translate(32 8) matrix(0.8667 0.5 -0.8667 0.5 0 0)">
    <use href="#plates" fill="url(#top)"/>
    <g clip-path="url(#clipTop)">
      <rect x="0" y="0" width="30" height="30" fill="url(#pool)"/>
      <ellipse cx="15.2" cy="15.6" rx="5.6" ry="4.6" fill="url(#blob)"/>
      <ellipse cx="24.6" cy="5.4" rx="2.6" ry="2.1" fill="url(#blob)"/>
    </g>
  </g>
  <!-- right face -->
  <g transform="translate(32 38) matrix(0.8667 -0.5 0 1 0 0)">
    <use href="#plates" fill="url(#right)"/>
    <g clip-path="url(#clipRight)">
      <ellipse cx="6.2" cy="24.4" rx="3.4" ry="2.9" fill="url(#blob)"/>
      <rect x="0" y="0" width="30" height="30" fill="url(#pool)" opacity="0.35"/>
    </g>
  </g>
  <!-- left face -->
  <g transform="translate(6 23) matrix(0.8667 0.5 0 1 0 0)">
    <use href="#plates" fill="url(#left)"/>
  </g>
  </g>
</svg>
